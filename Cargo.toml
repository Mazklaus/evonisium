[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license-file = "LICENSE"
publish = false
repository = "https://github.com/Mazklaus/evonisium"

[workspace.dependencies]
rand = "0.9"
rand_chacha = "0.9"
rand_distr = "0.5"
rayon = "1"
mimalloc = { version = "0.1", default-features = false }
serde = { version = "1", features = ["derive", "rc"] }
bincode = "1.3"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
rusqlite = { version = "0.32", features = ["bundled"] }
libm = "0.2"
evo-core = { path = "crates/evo-core" }
evo-planet = { path = "crates/evo-planet" }
evo-genetics = { path = "crates/evo-genetics" }
evo-life = { path = "crates/evo-life" }
evo-sim = { path = "crates/evo-sim" }
evo-engine = { path = "crates/evo-engine" }
evo-morph = { path = "crates/evo-morph" }
evo-view = { path = "crates/evo-view" }
evo-agents = { path = "crates/evo-agents" }

[profile.release]
debug = 1

# Les tests statistiques tournent des milliers de répliques : on les optimise.
[profile.test]
opt-level = 3
