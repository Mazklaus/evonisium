name: CI

on:
  push:
    branches: [main]
  pull_request:

# Une nouvelle poussée annule la vérification en cours de la même branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint et tests de validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Petite partie de bout en bout
        run: cargo run --release -p evo-sim -- run --level 4 --steps 50 --every 50

  empreinte:
    name: Rejeu identique (${{ matrix.os }})
    # macOS coûte dix fois plus de minutes : seulement sur main.
    strategy:
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-24.04", "windows-latest", "macos-latest"]') || fromJSON('["ubuntu-24.04", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Empreintes d'une partie scénarisée
        shell: bash
        run: cargo run --release -p evo-sim -- empreinte > empreinte-${{ matrix.os }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: empreinte-${{ matrix.os }}
          path: empreinte-${{ matrix.os }}.txt

  rejeu:
    name: Mêmes empreintes sur Linux, Windows et macOS
    needs: empreinte
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: empreinte-*
          merge-multiple: true
      - run: |
          diff empreinte-ubuntu-24.04.txt empreinte-windows-latest.txt
          if [ -f empreinte-macos-latest.txt ]; then diff empreinte-ubuntu-24.04.txt empreinte-macos-latest.txt; fi
          wc -l empreinte-ubuntu-24.04.txt

  client-linux:
    name: Client Godot (Linux) — portes des étapes 3 à 5
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GODOT: Godot_v4.6.1-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Pilote Vulkan logiciel et écran virtuel
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers xvfb
      - name: Godot 4.6.1
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.6.1-stable/$GODOT.zip
          unzip -q godot.zip && chmod +x $GODOT
      - run: cargo build --release -p evo-godot
      - name: Import du projet
        run: ./$GODOT --headless --path client --import || true
      - name: Rejeu — deux chemins de caméra et de curseur de vitesse, un point de sauvegarde
        run: ./$GODOT --headless --path client -- --porte --rejeu --niveau=4 --pas=40 --sortie=$PWD/porte/rejeu-linux
      # La partie jusqu'à l'oxygène dure une demi-heure : seulement sur main.
      - name: Partie jouée — créer, ensemencer, intervenir, voir l'oxygène monter
        if: github.event_name == 'push'
        timeout-minutes: 45
        run: xvfb-run -a -s "-screen 0 1600x900x24" ./$GODOT --rendering-driver vulkan --path client --resolution 1600x900 -- --porte --niveau=4 --duree-max=2400 --sortie=$PWD/porte/partie
      - name: Étape 4 — impact, « avec et sans », réseau, strates, régions, anatomie, comparateur
        timeout-minutes: 30
        run: xvfb-run -a -s "-screen 0 1600x900x24" ./$GODOT --rendering-driver vulkan --path client --resolution 1600x900 -- --porte4 --niveau=4 --sortie=$PWD/porte/etape4
      - name: Étape 5 — scène au sol, 1 000 animés et 100 000 imposteurs, les 12 actions
        timeout-minutes: 15
        run: xvfb-run -a -s "-screen 0 1600x900x24" ./$GODOT --rendering-driver vulkan --path client --resolution 1600x900 -- --porte5 --sortie=$PWD/porte/etape5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: porte-client-linux
          path: porte

  client-windows:
    name: Client Godot (Windows) — rejeu
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p evo-godot
      - name: Godot 4.6.1
        shell: bash
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_win64.exe.zip
          unzip -q godot.zip
      - name: Import du projet
        shell: bash
        run: ./Godot_v4.6.1-stable_win64_console.exe --headless --path client --import || true
      - name: Rejeu — deux chemins de caméra et de curseur de vitesse, un point de sauvegarde
        shell: bash
        run: ./Godot_v4.6.1-stable_win64_console.exe --headless --path client -- --porte --rejeu --niveau=4 --pas=40 --sortie=$(cygpath -m "$PWD")/porte/rejeu-windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: porte-client-windows
          path: porte

  client-rejeu-identique:
    name: Rejeu identique sous Linux et Windows
    needs: [client-linux, client-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: porte-client-*
          path: porte
      - name: Comparer les empreintes
        run: |
          L=$(jq -c '.empreintes' porte/porte-client-linux/rejeu-linux/rapport.json)
          W=$(jq -c '.empreintes' porte/porte-client-windows/rejeu-windows/rapport.json)
          echo "Linux   : $L"
          echo "Windows : $W"
          test "$L" = "$W"
